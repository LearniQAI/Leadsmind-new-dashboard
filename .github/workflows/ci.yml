name: CI

# The real, platform-independent test gate for this repo. Runs regardless of
# whether a Vercel build happens. Keep this green before merging to master.
#
# `push` only (no `pull_request`): every commit on every branch is tested,
# including before a PR exists, and GitHub still surfaces the result on the PR
# via the commit's check status. Adding `pull_request` would just double every
# run (this repo takes no PRs from forks).
on:
  push:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
